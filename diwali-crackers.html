<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05061a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Diwali Crackers</title>
<style>
  :root{--gold:#ffc94d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#05061a;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
  #top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 12px 8px;pointer-events:none;gap:8px}
  #top>*{pointer-events:auto}
  #count{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:20px;
    padding:7px 12px;font-size:14px;font-weight:600;min-width:62px;text-align:center}
  #title{font-size:15px;font-weight:700;color:#ffd77a;text-shadow:0 0 12px #ff9a00;white-space:nowrap}
  .icons{display:flex;gap:8px}
  .ic{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.1);color:#fff;font-size:19px;cursor:pointer;padding:0}
  .ic:active{transform:scale(.92)}
  #hint{position:fixed;left:0;right:0;top:calc(62px + env(safe-area-inset-top));text-align:center;
    font-size:13px;color:#d9d2ff;padding:0 24px;pointer-events:none;transition:opacity .6s}
  #hint.off{opacity:0}
  #dock{position:fixed;left:0;right:0;bottom:0}
  #msgbar{position:absolute;left:0;right:0;bottom:100%;display:none;gap:8px;padding:0 12px 8px}
  #msgbar.on{display:flex}
  #msg{flex:1;min-width:0;font-size:16px;padding:11px 14px;border-radius:24px;border:1px solid rgba(255,255,255,.25);
    background:rgba(10,8,28,.82);color:#fff;outline:none;user-select:text;-webkit-user-select:text}
  #msg::placeholder{color:#9a93c4}
  #send{border:0;border-radius:24px;padding:0 16px;font-size:15px;font-weight:700;color:#2a1500;cursor:pointer;
    background:linear-gradient(#ffd77a,#ff9a2e)}
  #send:active{transform:scale(.95)}
  #tray{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
    padding:12px 10px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(5,4,14,.95) 60%,rgba(5,4,14,0))}
  #tray::-webkit-scrollbar{display:none}
  .ck:first-child{margin-left:auto}.ck:last-child{margin-right:auto}
  .ck{flex:0 0 66px;border-radius:14px;padding:8px 2px 7px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);color:#fff;font-size:11px;cursor:pointer;white-space:nowrap;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  .ck b{font-size:24px;font-weight:400;line-height:1}
  .ck.sel{border-color:var(--gold);background:rgba(255,201,77,.22);box-shadow:0 0 14px rgba(255,201,77,.35)}
  .ck:active{transform:scale(.95)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="sky"></canvas>

<div id="top">
  <div id="count">🔥 0</div>
  <div id="title">Happy Diwali 🪔</div>
  <div class="icons">
    <button class="ic" id="finale" aria-label="Finale show">✨</button>
    <button class="ic" id="snd" aria-label="Sound on or off">🔊</button>
    <button class="ic" id="shot" aria-label="Share picture">📸</button>
  </div>
</div>
<div id="hint"></div>

<div id="dock">
  <div id="msgbar">
    <input id="msg" maxlength="28" placeholder="Type a name or message…" autocomplete="off" enterkeyhint="send">
    <button id="send">🚀 Send</button>
  </div>
  <div id="tray">
    <button class="ck sel" data-t="rocket"><b>🚀</b>Rocket</button>
    <button class="ck" data-t="seven"><b>🎆</b>7 Shot</button>
    <button class="ck" data-t="anaar"><b>⛲</b>Anaar</button>
    <button class="ck" data-t="chakra"><b>🌀</b>Chakri</button>
    <button class="ck" data-t="kambi"><b>🎇</b>Kambi</button>
    <button class="ck" data-t="hunter"><b>⚡</b>Hunter</button>
    <button class="ck" data-t="rainbow"><b>🌈</b>Rainbow</button>
    <button class="ck" data-t="snake"><b>🐍</b>Snake</button>
    <button class="ck" data-t="bijili"><b>🧧</b>Bijili</button>
    <button class="ck" data-t="ladi"><b>🧨</b>Saravedi</button>
    <button class="ck" data-t="tikli"><b>🔴</b>Tikli</button>
    <button class="ck" data-t="bomb"><b>💣</b>Laxmi</button>
    <button class="ck" data-t="gun"><b>🔫</b>Cap gun</button>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];

const bg = $("#bg"), sky = $("#sky"), msgEl = $("#msg");
const bctx = bg.getContext("2d"), sctx = sky.getContext("2d");
let W, H, DPR, groundY, sc;

/* ---------- background (sky, stars, skyline) ---------- */
function seeded(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function drawBg() {
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = bctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#03040f");
  g.addColorStop(0.55, "#120a2c");
  g.addColorStop(0.85, "#3a1a46");
  g.addColorStop(1, "#5a2646");
  bctx.fillStyle = g;
  bctx.fillRect(0, 0, W, H);
  const r = seeded(7);
  for (let i = 0; i < 90; i++) {
    bctx.globalAlpha = 0.25 + r() * 0.6;
    bctx.fillStyle = "#fff";
    const s = r() < 0.15 ? 1.6 : 1;
    bctx.fillRect(r() * W, r() * groundY * 0.8, s, s);
  }
  bctx.globalAlpha = 1;
  let x = -10;
  while (x < W + 10) {
    const w = 18 + r() * 34, h = 18 + r() * 70;
    bctx.fillStyle = "#0b0714";
    bctx.fillRect(x, groundY - h, w, h + 2);
    if (r() < 0.5) {
      bctx.beginPath();
      bctx.arc(x + w / 2, groundY - h, w * 0.32, Math.PI, 0);
      bctx.fill();
    }
    bctx.fillStyle = "#ffcf6b";
    for (let wy = groundY - h + 8; wy < groundY - 6; wy += 11) {
      for (let wx = x + 5; wx < x + w - 5; wx += 9) {
        if (r() < 0.22) { bctx.globalAlpha = 0.6 + r() * 0.4; bctx.fillRect(wx, wy, 3, 4); }
      }
    }
    bctx.globalAlpha = 1;
    x += w + r() * 3;
  }
  bctx.fillStyle = "#07050d";
  bctx.fillRect(0, groundY, W, H - groundY);
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [bg, sky]) { c.width = W * DPR; c.height = H * DPR; }
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  groundY = H - $("#tray").offsetHeight - 10;
  sc = clamp(Math.min(W, H) / 450, 0.8, 1.3);
  drawBg();
}
addEventListener("resize", () => {
  if (document.activeElement === msgEl && innerWidth === W) return; // keyboard opening
  resize();
});

/* ---------- audio (synthesised, no files) ---------- */
let AC = null, master = null, noiseBuf = null, quiet = false;
function initAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AC = new Ctx();
  const comp = AC.createDynamicsCompressor();
  master = AC.createGain(); master.gain.value = 0.85;
  master.connect(comp); comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
const canPlay = () => AC && !quiet;
function bang(vol = 1) {
  if (!canPlay()) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = rnd(0.6, 1.2);
  const f = AC.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(3500, t); f.frequency.exponentialRampToValueAtTime(180, t + 0.5);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 0.7);
  const o = AC.createOscillator(); o.frequency.setValueAtTime(130, t);
  o.frequency.exponentialRampToValueAtTime(38, t + 0.3);
  const og = AC.createGain();
  og.gain.setValueAtTime(vol * 0.8, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  o.connect(og); og.connect(master); o.start(t); o.stop(t + 0.4);
}
function bigBang() {
  if (!canPlay()) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = 0.5;
  const f = AC.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(2500, t); f.frequency.exponentialRampToValueAtTime(90, t + 0.9);
  const g = AC.createGain();
  g.gain.setValueAtTime(1.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 1.2);
  const o = AC.createOscillator(); o.frequency.setValueAtTime(90, t);
  o.frequency.exponentialRampToValueAtTime(28, t + 0.6);
  const og = AC.createGain();
  og.gain.setValueAtTime(1.3, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  o.connect(og); og.connect(master); o.start(t); o.stop(t + 0.8);
  crackle(6, 0.1);
}
function thump() { // mortar launch
  if (!canPlay()) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.18);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.25);
}
function pat(vol = 0.9) {
  if (!canPlay()) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = rnd(1.2, 1.8);
  const f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1200;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, rnd(0, 0.5)); s.stop(t + 0.1);
}
function whistle(dur) {
  if (!canPlay()) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(500, t); o.frequency.exponentialRampToValueAtTime(1900, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07, t + 0.1);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function hiss(dur, vol, hp) {
  if (!canPlay()) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.15);
  g.gain.setValueAtTime(vol, t + dur - 0.4); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
function crackle(n, vol = 0.12) {
  if (!canPlay()) return;
  for (let i = 0; i < n; i++) {
    const t = AC.currentTime + rnd(0.15, 1.1);
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = rnd(1500, 5000);
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, rnd(0, 0.5)); s.stop(t + 0.06);
  }
}
function buzz(ms) { if (!quiet && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

/* ---------- particles ---------- */
const parts = [], flashes = [], items = [], shocks = [], texts = [], letters = [];
let lit = 0, shake = 0;
function popText(x, y, txt, col, size) {
  texts.push({ x, y, txt, col, size, rot: rnd(-0.25, 0.25), life: 22, max: 22 });
}
function spark(x, y, vx, vy, life, h, o = {}) {
  if (parts.length > 3000) return;
  parts.push({
    x, y, px: x, py: y, vx, vy, life, max: life,
    g: o.g ?? 0.045, drag: o.drag ?? 0.965, h, h2: o.h2, sat: o.sat ?? 100, l: o.l ?? 60, w: o.w ?? 2,
    tw: !!o.tw, tail: !!o.tail, split: !!o.split, sa: o.sa ?? 0
  });
}
function flash(x, y, r, h, amp = 1) { flashes.push({ x, y, r, h, amp, life: 12, max: 12 }); }

/* ---------- realistic shell bursts ---------- */
function burst(x, y, kind, mul = 1) {
  const hue = rnd(0, 360), S = sc * mul;
  flash(x, y, 95 * S, hue); flash(x, y, 300 * S, hue, 0.2);
  const add = (a, s, life, h, o) => spark(x, y, Math.cos(a) * s, Math.sin(a) * s, life, h, o);
  switch (kind) {
    case "peony":
      for (let i = 0; i < 105; i++) add(rnd(0, TAU), (Math.random() < 0.7 ? rnd(4.6, 5.4) : rnd(1, 4)) * S, rnd(60, 85), hue + rnd(-14, 14), { tw: Math.random() < 0.35 });
      for (let i = 0; i < 22; i++) add(rnd(0, TAU), rnd(1.2, 2.6) * S, rnd(40, 55), hue + 180, { tw: true, l: 72 });
      break;
    case "chrysanthemum":
      for (let i = 0; i < 80; i++) add(rnd(0, TAU), rnd(3.8, 5.4) * S, rnd(75, 95), hue + rnd(-10, 10), { tail: true, g: 0.035, drag: 0.968, w: 2.2 });
      break;
    case "crossette":
      for (let i = 0; i < 14; i++) add(i / 14 * TAU + rnd(-0.1, 0.1), rnd(4.6, 5.4) * S, 70, hue + rnd(-8, 8), { split: true, sa: rnd(0, TAU), w: 2.8, l: 70, tail: true });
      break;
    case "colorchange":
      for (let i = 0; i < 100; i++) add(rnd(0, TAU), (Math.random() < 0.7 ? rnd(4.6, 5.4) : rnd(1, 4)) * S, rnd(75, 95), hue, { h2: hue + 140, tw: true });
      break;
    case "willow":
      for (let i = 0; i < 80; i++) add(rnd(0, TAU), rnd(1.6, 4.2) * S, rnd(100, 130), 42 + rnd(-6, 6), { g: 0.05, drag: 0.975, tw: true, l: 66, tail: true });
      break;
    case "ring":
      for (let i = 0; i < 44; i++) add(i / 44 * TAU, 4.4 * S, rnd(60, 75), hue, {});
      for (let i = 0; i < 24; i++) add(i / 24 * TAU, 2.2 * S, rnd(50, 65), hue + 160, { tw: true });
      break;
    case "palm": {
      const arms = 7, rot = rnd(0, TAU);
      for (let i = 0; i < arms; i++) {
        const base = rot + i / arms * TAU;
        for (let j = 0; j < 11; j++) add(base + rnd(-0.05, 0.05), (2 + j * 0.4) * S, rnd(80, 100), 42 + rnd(-5, 5), { tail: true, g: 0.05, drag: 0.975, w: 2.4, l: 66, tw: j > 6 });
      }
      break;
    }
    case "heart":
      for (let i = 0; i < 100; i++) {
        const t = i / 100 * TAU;
        spark(x, y, 16 * Math.pow(Math.sin(t), 3) / 16 * 5 * S,
          -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16 * 5 * S,
          rnd(60, 85), 340 + rnd(-10, 10), { tw: true });
      }
      break;
    default: // multicolour
      for (let i = 0; i < 100; i++) add(rnd(0, TAU), (Math.random() < 0.7 ? rnd(4.6, 5.4) : rnd(1, 4)) * S, rnd(60, 85), rnd(0, 360), { tw: Math.random() < 0.35 });
  }
  setTimeout(() => { bang(0.9 * Math.min(mul, 1.2)); crackle(kind === "willow" || kind === "palm" ? 10 : 5); }, rnd(60, 140));
  buzz(30);
}
const KINDS = ["peony", "peony", "chrysanthemum", "chrysanthemum", "crossette", "colorchange", "willow", "ring", "palm", "heart", "multi"];

/* ---------- name / message written in the sky ---------- */
function showText(msg, cx, cy) {
  msg = msg.trim().slice(0, 28);
  if (!msg) return;
  let lines = [msg];
  if (msg.length > 12 && msg.indexOf(" ") > 0) {
    const mid = msg.length / 2; let best = -1, bd = 1e9;
    for (let i = 0; i < msg.length; i++) if (msg[i] === " " && Math.abs(i - mid) < bd) { bd = Math.abs(i - mid); best = i; }
    if (best > 0) lines = [msg.slice(0, best).trim(), msg.slice(best + 1).trim()];
  }
  const fam = '"Segoe UI",system-ui,"Noto Sans Tamil","Noto Sans Devanagari",sans-serif';
  const off = document.createElement("canvas"), o = off.getContext("2d");
  o.font = `800 72px ${fam}`;
  const w72 = Math.max(...lines.map(l => o.measureText(l).width));
  const k = Math.min(1, W * 0.84 / w72), fs = Math.max(20, 72 * k);
  const cw = Math.ceil(w72 * k + 24), lh = fs * 1.2, ch = Math.ceil(lh * lines.length + 20);
  off.width = cw; off.height = ch;
  o.font = `800 ${fs}px ${fam}`; o.textAlign = "center"; o.textBaseline = "middle"; o.fillStyle = "#fff";
  lines.forEach((l, i) => o.fillText(l, cw / 2, 10 + lh * (i + 0.5)));
  const data = o.getImageData(0, 0, cw, ch).data;
  let gap = Math.max(2, Math.round(fs / 16)), pts;
  for (;;) {
    pts = [];
    for (let y = 0; y < ch; y += gap) for (let x = 0; x < cw; x += gap) if (data[(y * cw + x) * 4 + 3] > 128) pts.push([x - cw / 2, y - ch / 2]);
    if (pts.length <= 1000 || gap > 12) break;
    gap++;
  }
  const tx0 = clamp(cx, cw / 2 + 6, W - cw / 2 - 6), ty0 = clamp(cy, ch / 2 + 96, groundY - ch / 2 - 20);
  for (const p of pts) letters.push({
    x: cx, y: cy, tx: tx0 + p[0], ty: ty0 + p[1], t: -rnd(0, 8),
    fly: rnd(26, 38), hold: rnd(110, 150), fall: rnd(60, 90), h: 42 + rnd(-8, 10), vx: rnd(-0.4, 0.4), cx: cx, cy: cy
  });
}

/* ---------- crackers ---------- */
const DELAY = { rocket: 45, seven: 55, anaar: 45, chakra: 45, kambi: 0, hunter: 25, rainbow: 25, snake: 35, bijili: 40, ladi: 40, tikli: 30, bomb: 75 };
const SP = { // wire sparklers and matches
  kambi: { dur: 380, L: 92, n: 5, sp: [0.8, 3.6], life: [16, 34], hue: [38, 50], w: 1.3, l: 78 },
  hunter: { dur: 230, L: 70, n: 12, sp: [1.5, 6.2], life: [8, 22], hue: [40, 56], w: 1.8, l: 88 },
  rainbow: { dur: 270, L: 50 }
};
const HINTS = {
  rocket: "Tap to place a rocket anywhere. Type a name first and it appears in the sky after the burst, or press Send",
  seven: "Tap to place a 7-shot. It fires 7 shells, one after another",
  anaar: "Tap anywhere to place an anaar and light it",
  chakra: "Tap anywhere to place a chakri and light it",
  kambi: "Tap anywhere to light a kambi mathappu (wire sparkler)",
  hunter: "Tap anywhere to light a hunter. It burns hard and crackles",
  rainbow: "Tap anywhere to strike a rainbow match",
  snake: "Tap anywhere to light a snake tablet and watch it grow",
  bijili: "Tap anywhere to place a bijili vedi. Quick, sharp snap",
  ladi: "Tap anywhere to hang a saravedi. It bursts from the bottom up",
  tikli: "Tap anywhere to lay a tikli strip. The dots pop along it",
  bomb: "Tap anywhere to place a Laxmi bomb. Big bang, so check the volume!",
  gun: "Cap gun! Tap to aim and fire. Hold your finger down for rapid fire"
};
function addItem(type, x, y, o = {}) {
  if (items.length > 45) return;
  const it = { type, x, y, t: 0, delay: o.fast ? 8 : DELAY[type], hue: rnd(0, 360), msg: o.msg || "", fh: 0 };
  if (type === "rocket") {
    it.fy = y - 30;
    let ty = Math.max(50, Math.min(y - 110, y - rnd(220, 400) * sc));
    if (it.msg) ty = Math.max(ty, Math.min(150, y - 110));
    it.ty = o.ty ?? ty;
  }
  if (type === "seven") {
    it.next = 0;

    if (f.amp <= 0) continue;
    const a = f.life / f.max, r = f.r * (1.2 - a * 0.4);
    const g = sctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    g.addColorStop(0, `hsla(${f.h},100%,88%,${a * 0.85 * f.amp})`);
    g.addColorStop(1, `hsla(${f.h},100%,50%,0)`);
    sctx.fillStyle = g; sctx.fillRect(f.x - r, f.y - r, r * 2, r * 2);
  }
  for (let i = shocks.length - 1; i >= 0; i--) {
    const s = shocks[i]; s.life -= dt;
    if (s.life <= 0) { shocks.splice(i, 1); continue; }
    s.r += 9 * sc * dt;
    const a = s.life / s.max;
    sctx.strokeStyle = `hsla(40,100%,85%,${a * 0.6})`; sctx.lineWidth = 2 + a * 5;
    sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, TAU); sctx.stroke();
  }
  const dp = Math.pow;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    if (p.split && p.life < p.max * 0.5) { // crossette: star splits into four
      for (let k = 0; k < 4; k++) {
        const a = p.sa + k * TAU / 4;
        spark(p.x, p.y, Math.cos(a) * 2.8 * sc + p.vx * 0.3, Math.sin(a) * 2.8 * sc + p.vy * 0.3, rnd(34, 44), p.h, { g: 0.045, drag: 0.965, w: 2, tw: true });
      }
      flash(p.x, p.y, 22 * sc, p.h, 0.6);
      parts[i] = parts[parts.length - 1]; parts.pop(); continue;
    }
    p.px = p.x; p.py = p.y;
    p.vx *= dp(p.drag, dt); p.vy = p.vy * dp(p.drag, dt) + p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    let a = p.life / p.max;
    const h = p.h2 !== undefined ? p.h + (p.h2 - p.h) * (1 - a) : p.h;
    if (p.tail && Math.random() < 0.5) spark(p.px, p.py, rnd(-0.2, 0.2), rnd(0, 0.4), rnd(10, 16), h, { g: 0.02, w: 1.1, l: p.l, drag: 0.9 });
    if (p.tw && Math.random() < 0.25) a *= 0.3;
    sctx.strokeStyle = `hsla(${h},${p.sat}%,${p.l}%,${a})`;
    sctx.lineWidth = p.w;
    sctx.beginPath(); sctx.moveTo(p.px, p.py); sctx.lineTo(p.x, p.y); sctx.stroke();
  }
  for (let i = letters.length - 1; i >= 0; i--) { // the message made of sparks
    const L = letters[i]; L.t += dt;
    if (L.t < 0) continue;
    let a = 1;
    if (L.t < L.fly) {
      const u = L.t / L.fly, e = 1 - Math.pow(1 - u, 3);
      L.cx = L.x + (L.tx - L.x) * e; L.cy = L.y + (L.ty - L.y) * e; a = 0.4 + 0.6 * u;
    } else if (L.t < L.fly + L.hold) {
      L.cx = L.tx + rnd(-0.5, 0.5); L.cy = L.ty + rnd(-0.5, 0.5);
      a = Math.random() < 0.12 ? 0.5 : 1;
    } else {
      const u = (L.t - L.fly - L.hold) / L.fall;
      if (u >= 1) { letters[i] = letters[letters.length - 1]; letters.pop(); continue; }
      L.cx = L.tx + L.vx * u * 30; L.cy = L.ty + u * u * 70; a = 1 - u;
    }
    sctx.fillStyle = `hsla(${L.h},100%,70%,${a})`;
    sctx.fillRect(L.cx - 1.4, L.cy - 1.4, 2.8, 2.8);
  }
  sctx.globalCompositeOperation = "source-over";
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i]; t.life -= dt;
    if (t.life <= 0) { texts.splice(i, 1); continue; }
    const a = t.life / t.max;
    sctx.save();
    sctx.translate(t.x, t.y); sctx.rotate(t.rot);
    sctx.globalAlpha = Math.min(1, a * 1.6);
    sctx.font = `900 ${t.size * (1 + (1 - a) * 0.3)}px Impact, system-ui, sans-serif`;
    sctx.textAlign = "center"; sctx.lineWidth = 5; sctx.lineJoin = "round";
    sctx.strokeStyle = "#7a1200"; sctx.strokeText(t.txt, 0, 0);
    sctx.fillStyle = t.col; sctx.fillText(t.txt, 0, 0);
    sctx.restore();
  }
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
let sel = "rocket";
function showHint(txt) { const h = $("#hint"); h.textContent = txt || HINTS[sel]; h.classList.remove("off"); }
function setSel(t, btn) {
  sel = t; stopGun();
  document.querySelectorAll(".ck").forEach(x => x.classList.toggle("sel", x === btn));
  $("#msgbar").classList.toggle("on", t === "rocket");
  showHint();
}
document.querySelectorAll(".ck").forEach(b => b.addEventListener("click", () => {
  initAudio(); setSel(b.dataset.t, b);
}));
sky.addEventListener("pointerdown", e => {
  e.preventDefault(); initAudio();
  if (document.activeElement === msgEl) msgEl.blur();
  if (sel === "gun") {
    stopGun();
    gunPt = { x: e.clientX, y: e.clientY };
    try { sky.setPointerCapture(e.pointerId); } catch (err) {}
    fire(gunPt.x, gunPt.y);
    gunTimer = setInterval(() => gunPt && fire(gunPt.x, gunPt.y), 130);
    return;
  }
  const x = e.clientX, y = clamp(e.clientY, 100, groundY);
  if (sel === "rocket") {
    const msg = msgEl.value.trim();
    addItem("rocket", x, y, { msg });
    if (msg) { msgEl.value = ""; showHint("Message sent! Watch for the burst"); }
  } else addItem(sel, x, y);
});
sky.addEventListener("pointermove", e => { if (gunPt) { gunPt.x = e.clientX; gunPt.y = e.clientY; } });
["pointerup", "pointercancel", "pointerleave"].forEach(n => sky.addEventListener(n, stopGun));
document.addEventListener("visibilitychange", stopGun);

function sendMessage() {
  initAudio();
  const msg = msgEl.value.trim();
  addItem("rocket", W / 2, groundY, { msg, fast: true });
  msgEl.value = ""; msgEl.blur();
  if (msg) showHint("Message sent! Watch the sky");
}
$("#send").addEventListener("click", sendMessage);
msgEl.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendMessage(); } });

$("#snd").addEventListener("click", () => {
  initAudio(); quiet = !quiet;
  $("#snd").textContent = quiet ? "🔇" : "🔊";
  showHint(quiet ? "Quiet mode: no sound, no vibration. Kind to pets and babies" : "Sound on");
  setTimeout(() => $("#hint").classList.add("off"), 2200);
});
function finale() {
  initAudio();
  const g = groundY, F = { fast: true };
  addItem("anaar", W * 0.12, g, F); addItem("anaar", W * 0.88, g, F);
  addItem("seven", W * 0.5, g, F);
  for (let i = 0; i < 14; i++) {
    setTimeout(() => addItem("rocket", rnd(W * 0.1, W * 0.9), g, F), 500 + i * 300);
  }
  setTimeout(() => { addItem("chakra", W * 0.3, g, F); addItem("chakra", W * 0.7, g, F); }, 2400);
  setTimeout(() => addItem("ladi", W * 0.2, g, F), 3000);
  setTimeout(() => addItem("ladi", W * 0.8, g, F), 3300);
  setTimeout(() => { addItem("bomb", W * 0.35, g, F); addItem("bomb", W * 0.65, g, F); }, 5200);
}
$("#finale").addEventListener("click", finale);
$("#shot").addEventListener("click", () => {
  const c = document.createElement("canvas");
  c.width = sky.width; c.height = sky.height;
  const x = c.getContext("2d");
  x.drawImage(bg, 0, 0); x.drawImage(sky, 0, 0);
  x.font = `700 ${24 * DPR}px system-ui,sans-serif`; x.textAlign = "center";
  x.fillStyle = "#ffd77a"; x.shadowColor = "#ff9a00"; x.shadowBlur = 14 * DPR;
  x.fillText("Happy Diwali 🪔", c.width / 2, 64 * DPR);
  c.toBlob(async b => {
    const f = new File([b], "happy-diwali.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f], title: "Happy Diwali!" }); return; }
      catch (err) { if (err.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "happy-diwali.png"; a.click();
  }, "image/png");
});

resize(); setSel("rocket", document.querySelector('[data-t="rocket"]'));
requestAnimationFrame(t => { last = t; frame(t); });
</script>
